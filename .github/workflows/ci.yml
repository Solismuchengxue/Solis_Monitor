name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Install Python tooling dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt

      - name: Restore desktop application
        run: dotnet restore .\app\LibreHardwareMonitor\LibreHardwareMonitor\LibreHardwareMonitor.csproj --disable-parallel -p:NuGetAudit=false

      - name: Restore notification host
        run: dotnet restore .\app\LibreHardwareMonitor\SolisMonitor.NotificationHost\SolisMonitor.NotificationHost.csproj --disable-parallel -p:NuGetAudit=false -p:Platform=x64

      - name: Restore desktop smoke tests
        run: dotnet restore .\app\tests\SolisMonitor.Metrics.SmokeTests\SolisMonitor.Metrics.SmokeTests.csproj --disable-parallel -p:NuGetAudit=false -p:Platform=x64

      - name: Build desktop application
        run: dotnet build .\app\LibreHardwareMonitor\LibreHardwareMonitor\LibreHardwareMonitor.csproj --configuration Release --no-restore -p:Platform=x64 -m:1 -p:BuildInParallel=false

      - name: Build desktop smoke tests
        run: dotnet build .\app\tests\SolisMonitor.Metrics.SmokeTests\SolisMonitor.Metrics.SmokeTests.csproj --configuration Release --no-restore -p:Platform=x64 -m:1 -p:BuildInParallel=false

      - name: Run desktop smoke tests
        run: dotnet run --project .\app\tests\SolisMonitor.Metrics.SmokeTests\SolisMonitor.Metrics.SmokeTests.csproj --configuration Release --no-build --no-restore -p:Platform=x64

      - name: Run Python tooling tests
        run: python -m unittest discover -s tools\tests -p "test_*.py" -v
