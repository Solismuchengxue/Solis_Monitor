<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solis Monitor 配网</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#071019;color:#eef8ff}body{margin:0;padding:20px}.card{max-width:520px;margin:auto;background:#101d2b;border:1px solid #35bde5;border-radius:16px;padding:22px;box-shadow:0 10px 30px #0008}h1{margin:0 0 8px;color:#4cdcff}p{color:#a9bfce;line-height:1.55}label{display:block;margin-top:16px;font-weight:600}input,select,button{box-sizing:border-box;width:100%;margin-top:7px;padding:13px;border-radius:9px;border:1px solid #355064;background:#07131e;color:#fff;font-size:16px}button{margin-top:22px;background:#14a9d2;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.row button{width:auto;margin-top:7px}.msg{min-height:24px;margin-top:14px;color:#65dda8}.error{color:#ff8a9a}.danger{margin-top:26px;padding-top:20px;border-top:1px solid #355064}.danger h2{margin:0;font-size:18px;color:#ffb1b9}.danger button{margin-top:8px;background:#8f2534}.danger p{margin:8px 0 0;font-size:14px}[hidden]{display:none!important}
</style></head><body><main class="card"><h1>Solis Monitor</h1><p>连接或更换副屏使用的 Wi‑Fi。</p><form id="f"><label>Wi‑Fi</label><div class="row"><select id="ssid" required><option value="">正在扫描…</option></select><button type="button" id="scan">扫描</button></div><label>Wi‑Fi 密码</label><input id="password" type="password" autocomplete="new-password" maxlength="64" placeholder="已配置时留空可保留"><button type="submit" id="save">保存并连接</button></form><div id="msg" class="msg"></div><section class="danger"><h2>恢复默认设置</h2><p>清除全部 Wi‑Fi、PC 配对关系和设备令牌。设备名称不会改变。</p><button type="button" id="reset">恢复默认设置</button></section></main><script>
const $=id=>document.getElementById(id),msg=(t,e=false)=>{$('msg').textContent=t;$('msg').className=e?'msg error':'msg'};async function scan(){msg('正在扫描…');try{const r=await fetch('/api/scan',{cache:'no-store'}),a=await r.json(),s=$('ssid'),old=s.value;s.innerHTML='<option value="">请选择 Wi‑Fi</option>';a.networks.forEach(n=>{const o=document.createElement('option');o.textContent=n.ssid+(n.rssi?' ('+n.rssi+' dBm)':'');o.value=n.ssid;s.appendChild(o)});if(old&&!Array.from(s.options).some(o=>o.value===old)){const o=document.createElement('option');o.value=o.textContent=old;s.appendChild(o)}s.value=old;msg('扫描完成')}catch(e){msg('扫描失败，请重试',true)}}async function load(){let current='';try{const c=await(await fetch('/api/config',{cache:'no-store'})).json();current=c.ssid||'';if(c.has_password)$('password').placeholder='留空可保留当前密码'}catch(e){}if(current){const o=document.createElement('option');o.value=o.textContent=current;$('ssid').appendChild(o);$('ssid').value=current}await scan()}$('scan').onclick=scan;$('f').onsubmit=async e=>{e.preventDefault();const b=new URLSearchParams({ssid:$('ssid').value,password:$('password').value});msg('正在保存…');try{const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b}),j=await r.json();if(!r.ok)throw Error(j.error||'保存失败');msg('保存成功，设备正在连接 Wi‑Fi')}catch(x){msg(x.message,true)}};$('reset').onclick=async()=>{if(!confirm('确定恢复默认设置吗？\n\n这会清除全部 Wi‑Fi、PC 配对关系和设备令牌，随后设备将重启并进入 AP 配网模式。'))return;$('reset').disabled=true;msg('正在恢复默认设置…');try{const b=new URLSearchParams({confirm:'restore'}),r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b}),j=await r.json();if(!r.ok)throw Error(j.error||'恢复失败');msg('恢复完成。请连接热点 '+j.ap_ssid+'，再打开 http://192.168.0.1/ 重新配网。设备正在重启…')}catch(x){$('reset').disabled=false;msg(x.message,true)}};load();
</script></body></html>
